services:
  backend:
    build:
      context: .
      dockerfile: BlockChainAnalysis/Dockerfile
    container_name: blockchain_api
    ports:
      - "5084:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

  frontend:
    build:
      context: ./BlockchainFrontend
      dockerfile: Dockerfile
    container_name: blockchain_ui
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
